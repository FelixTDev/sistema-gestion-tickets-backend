x-app-environment: &app-environment
  DATABASE_URL: mysql+pymysql://${MYSQL_USER:-tickets}:${MYSQL_PASSWORD:-tickets}@db:3306/${MYSQL_DATABASE:-tickets}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
  APP_ENV: ${APP_ENV:-development}
  DEBUG: ${DEBUG:-true}
  SECRET_KEY: ${SECRET_KEY:-change-this-development-secret-key-32-chars-min}
  TRUSTED_HOSTS: '${TRUSTED_HOSTS:-["localhost","127.0.0.1","testserver"]}'
  CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
  ATTACHMENT_STORAGE_DIR: /app/var/uploads
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-noop}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
  CHATBOT_AI_ENABLED: ${CHATBOT_AI_ENABLED:-false}
  CHATBOT_AI_PROVIDER: ${CHATBOT_AI_PROVIDER:-noop}
  CHATBOT_AI_ENDPOINT: ${CHATBOT_AI_ENDPOINT:-}
  CHATBOT_AI_API_KEY: ${CHATBOT_AI_API_KEY:-}
  CHATBOT_AI_MODEL: ${CHATBOT_AI_MODEL:-gpt-5.4-mini}
  CHATBOT_AI_PROMPT_VERSION: ${CHATBOT_AI_PROMPT_VERSION:-v1}
  CHATBOT_AI_TIMEOUT_SECONDS: ${CHATBOT_AI_TIMEOUT_SECONDS:-15}
  CHATBOT_AI_MAX_OUTPUT_CHARS: ${CHATBOT_AI_MAX_OUTPUT_CHARS:-1200}
  CHATBOT_AI_MAX_OUTPUT_TOKENS: ${CHATBOT_AI_MAX_OUTPUT_TOKENS:-384}
  CHATBOT_AI_MAX_DOCUMENTS: ${CHATBOT_AI_MAX_DOCUMENTS:-3}
  CHATBOT_AI_MAX_CONTEXT_CHARS: ${CHATBOT_AI_MAX_CONTEXT_CHARS:-6000}
  CHATBOT_AI_MIN_CONFIDENCE: ${CHATBOT_AI_MIN_CONFIDENCE:-0.70}
  CHATBOT_AI_REQUESTS_PER_MINUTE: ${CHATBOT_AI_REQUESTS_PER_MINUTE:-5}
  CHATBOT_AI_MAX_RESPONSES_PER_CONVERSATION: ${CHATBOT_AI_MAX_RESPONSES_PER_CONVERSATION:-3}
  CHATBOT_AI_MAX_PROVIDER_CALLS_PER_ACTOR_PER_HOUR: ${CHATBOT_AI_MAX_PROVIDER_CALLS_PER_ACTOR_PER_HOUR:-20}
  CHATBOT_AI_MAX_CONSECUTIVE_FAILURES: ${CHATBOT_AI_MAX_CONSECUTIVE_FAILURES:-3}
  CHATBOT_AI_COOLDOWN_SECONDS: ${CHATBOT_AI_COOLDOWN_SECONDS:-60}
  CHATBOT_AI_IDEMPOTENCY_WINDOW_SECONDS: ${CHATBOT_AI_IDEMPOTENCY_WINDOW_SECONDS:-30}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DEMO_CLIENT_PASSWORD: ${DEMO_CLIENT_PASSWORD:-demo-password-local}
  DEMO_ADVISOR_PASSWORD: ${DEMO_ADVISOR_PASSWORD:-demo-password-local}
  DEMO_SUPERVISOR_PASSWORD: ${DEMO_SUPERVISOR_PASSWORD:-demo-password-local}

x-app-service: &app-service
  image: ticket-management-backend:local
  build:
    context: .
    dockerfile: Dockerfile
  environment: *app-environment
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tickets}
      MYSQL_USER: ${MYSQL_USER:-tickets}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tickets}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-local-password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *app-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  seed:
    <<: *app-service
    command: ["python", "-m", "app.seed.demo_data"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: "no"

  api:
    <<: *app-service
    ports:
      - "8000:8000"
    volumes:
      - attachments_data:/app/var/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql_data:
  attachments_data:
